# Her gün Hugging Face'teki en yeni sezonla stats/*.json'u yeniden üretir; değiştiyse depoya koyar (uygulama raw URL'den indirir).
name: stats
on:
  # 6 saatte bir: kaynak gün içinde farklı saatlerde güncelleniyor (2026-10-14: 19:51 UTC), GitHub zamanlanmış işi de
  # saatlerce geciktiriyor (05:00 yerine 10-12). Yeni veri yoksa dosyalar aynı çıkar, commit olmaz. Sezon başında yeni
  # haritalar da en geç birkaç saatte gelir.
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyarrow scipy  # scipy: kazanma modeli (build_stats.Model)
      - name: En yeni sezonu indir
        # Yeni sezonun ilk günlerinde veri az: build_stats.MIN_SETS bandı komşu bantlarla genişletir, o da yetmezse eski dosyayı bırakır.
        run: |
          F=$(curl -sf https://huggingface.co/api/datasets/EliF77/brawlstars-ranked | python -c "import json,re,sys; f=[s['rfilename'] for s in json.load(sys.stdin)['siblings'] if s['rfilename'].endswith('.parquet')]; print(max(f, key=lambda x: int(re.search(r'season(\d+)', x).group(1))))")
          S=$(echo "$F" | grep -o 'season[0-9]*' | tail -1)
          curl -sfL -o "$S.parquet" "https://huggingface.co/datasets/EliF77/brawlstars-ranked/resolve/main/$F"
          echo "S=$S" >> "$GITHUB_ENV"
      - run: python build_stats.py "$S.parquet"
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add stats
          # Araya başka bir push girdiyse (elle başlatılan iş, depoya yapılan değişiklik) önce üstüne al: 2026-10-14'te bu yüzden düştü.
          git diff --cached --quiet || { git commit -m "stats: $S" && git pull -q --rebase && git push; }
      - name: Veri bayatsa haber ver
        # Dosyalar yukarıda yayınlandı; son maç STALE_DAYS'ten eskiyse iş kırmızıya döner ve GitHub depo sahibine e-posta atar
        # (kaynak durdu, ya da yeni sezon günlerdir MIN_SETS'e ulaşamadı).
        run: python -c "import build_stats, sys; sys.exit(build_stats.stale())"
